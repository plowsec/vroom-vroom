[package]
name = "vroom-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vroom-proto = { path = "../crates/proto" }
vroom-net = { path = "../crates/net" }
vroom-virtio = { path = "../crates/virtio" }
vroom-devices = { path = "../crates/devices" }
vroom-memory = { path = "../crates/memory" }
vroom-block = { path = "../crates/block" }
vroom-fs = { path = "../crates/fs" }
vroom-display = { path = "../crates/display" }
tempfile = "3"

# Not part of the main workspace (needs nightly + sanitizers).
[workspace]

[[bin]]
name = "proto_decoder"
path = "fuzz_targets/proto_decoder.rs"
test = false
doc = false

