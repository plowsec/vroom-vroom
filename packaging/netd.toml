# /etc/vroom/netd.toml: vroom-netd, vroom's helper that runs as root.
# Only members of `group` can talk to it.
socket = "/var/run/vroom/netd.sock"
group = "staff"            # Linux: "vroom"

# Interfaces VMs may bridge onto. A name ending in * covers all that
# start that way: en* is every Ethernet and Wi-Fi port of a Mac.
# Linux: an existing bridge (br0) you created with your NIC enslaved.
bridge_interfaces = ["en*"]

# Private host-only networks (VMs + host, no outside access). gateway:
# the host's address; DHCP for the rest of the subnet. None here: `lab`
# on 192.168.77.1/24.
[[host_only]]
name = "lab"
gateway = "192.168.77.1/24"

# USB devices macOS holds (keyboards, disks, webcams, serial chips): the
# helper takes them from macOS for a VM. Only members of this group may ask.
[usb]
enabled = true
group = "admin"            # Linux: "vroom"
