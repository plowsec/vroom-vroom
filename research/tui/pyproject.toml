[project]
name = "vroom-atui"
version = "0.1.0"
description = "vroom-lab as an angr_tui target: live Windows ARM64 kernel debugging"
requires-python = ">=3.12"
dependencies = ["angr-tui", "bitstring<5"]

[project.entry-points."atui.plugins"]
vroom = "vroom_atui:PLUGIN"

[project.scripts]
vroom-atui = "vroom_atui.launch:main"

[tool.uv.sources]
angr-tui = { path = "../../../angr_tui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vroom_atui"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
