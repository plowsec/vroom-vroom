[workspace]
resolver = "2"
members = ["crates/*", "research/kernel", "research/fuzz"]
default-members = ["crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
vroom-memory = { path = "crates/memory" }
vroom-hv = { path = "crates/hv" }
vroom-devices = { path = "crates/devices" }
vroom-virtio = { path = "crates/virtio" }
vroom-arch = { path = "crates/arch" }
vroom-vmm = { path = "crates/vmm" }
vroom-config = { path = "crates/config" }
vroom-snapshot = { path = "crates/snapshot" }
vroom-net = { path = "crates/net" }
vroom-proto = { path = "crates/proto" }
vroom-sandbox = { path = "crates/sandbox" }
vroom-block = { path = "crates/block" }
vroom-agent = { path = "crates/agent" }
vroom-display = { path = "crates/display" }
vroom-ipc = { path = "crates/ipc" }
vroom-gpu3d = { path = "crates/gpu3d" }
vroom-fs = { path = "crates/fs" }
vroom-audio = { path = "crates/audio" }
vroom-state = { path = "crates/state" }
vroom-import = { path = "crates/import" }
vroom-usb = { path = "crates/usb" }

thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vm-fdt = "0.3"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev]
panic = "abort"

# Hashing, decompression etc. are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
