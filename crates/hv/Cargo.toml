[package]
name = "bulwark-hv"
description = "Hypervisor abstraction with HVF (macOS) and KVM (Linux) backends."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
log.workspace = true
libc.workspace = true
serde.workspace = true
bulwark-memory.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.19"
kvm-bindings = { version = "0.10", features = ["fam-wrappers"] }

[lints]
workspace = true

[build-dependencies]
cc = "1"
