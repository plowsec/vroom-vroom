[package]
name = "vroom-agent"
description = "Guest agent: clipboard, time sync, clean shutdown. Runs inside the VM."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vroom-agent"
path = "src/main.rs"

[dependencies]
vroom-proto.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Reads Mutter's display state (busctl --json) to set the scale on Wayland.
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_System_Time", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Devices_Display", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Ole", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_UI_HiDpi"] }

[lints]
workspace = true
